version: 2

project_name: replicateme

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/replicateme
    binary: replicateme
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

# Homebrew formula is maintained manually in jschell12/homebrew-tap.
# See examples/replicateme.rb.template for the formula template.
# The goreleaser `brews` field is deprecated and has been removed.

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: jschell12
    name: replicateme
